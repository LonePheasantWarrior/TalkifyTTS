name: Release

on:
  push:
    tags: ['v*']

# N16：第三方 Action 全部按 commit SHA 固定（tag 可被重指，SHA 不可变）；
# 工作流级显式无权限（permissions: {}），写权限仅下沉到发布 job
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Extract signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TALKIFY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TALKIFY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TALKIFY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TALKIFY_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APKs
        run: ./gradlew assembleRelease --console=plain --no-daemon

      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # 命名约定与 UpdateChecker.findApkAssetUrl 的选包规则一致
          cp app/build/outputs/apk/release/Talkify-v${VERSION}-*.apk dist/
          cp app/build/outputs/mapping/release/mapping.txt "dist/Talkify-v${VERSION}-mapping.txt"
          ls -la dist/

      # R-O①：发布门禁——原生库 16KB 页对齐（targetSdk 35+/16KB 设备兼容），
      # 防 sherpa-onnx AAR 升级引入未对齐库的回归；失败则本 job 终止、不产生 Release
      - name: Verify 16KB page alignment
        run: python3 scripts/check_16kb_alignment.py dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
