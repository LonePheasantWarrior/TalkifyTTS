name: Release

on:
  push:
    tags: ['v*']

# N16：第三方 Action 全部按 commit SHA 固定（tag 可被重指，SHA 不可变）；
# 工作流级显式无权限（permissions: {}），写权限仅下沉到发布 job
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Extract signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TALKIFY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TALKIFY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TALKIFY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TALKIFY_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # N19-g：匿名遥测端点与网站 ID 经环境变量注入 BuildConfig（不入库）。
      # 发布策略（U13/R09）：构建脚本执行与运行时等价的严格校验；Required 模式缺配
      # 或非法配置直接失败。摘要读取构建生成的规范化状态，而不是按 secrets 非空猜测。
      - name: Telemetry configuration policy
        env:
          UMAMI_ENDPOINT: ${{ secrets.UMAMI_ENDPOINT }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          TALKIFY_REQUIRE_TELEMETRY: ${{ vars.TALKIFY_REQUIRE_TELEMETRY }}
        run: |
          ./gradlew :app:writeTelemetryStatus --console=plain --no-daemon
          STATUS=$(head -n 1 app/build/telemetry/telemetry-status.txt)
          echo "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "TELEMETRY_STATUS=$STATUS" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          UMAMI_ENDPOINT: ${{ secrets.UMAMI_ENDPOINT }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          TALKIFY_REQUIRE_TELEMETRY: ${{ vars.TALKIFY_REQUIRE_TELEMETRY }}
        run: ./gradlew assembleRelease --console=plain --no-daemon

      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # 命名约定与 UpdateChecker.findApkAssetUrl 的选包规则一致
          cp app/build/outputs/apk/release/Talkify-v${VERSION}-*.apk dist/
          cp app/build/outputs/mapping/release/mapping.txt "dist/Talkify-v${VERSION}-mapping.txt"
          ls -la dist/

      # R-O①：发布门禁——原生库 16KB 页对齐（targetSdk 35+/16KB 设备兼容），
      # 防 sherpa-onnx AAR 升级引入未对齐库的回归；失败则本 job 终止、不产生 Release
      - name: Verify 16KB page alignment
        run: python3 scripts/check_16kb_alignment.py dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

      # R09：禁用版本把规范化状态自动写入 Release 说明，不能只依赖维护者手写
      - name: Annotate release with telemetry status
        if: contains(env.TELEMETRY_STATUS, 'DISABLED')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BODY=$(gh release view "$TAG" --json body -q .body)
          NOTES=$(mktemp)
          printf '%s\n\n%s\n' "$TELEMETRY_STATUS" "$BODY" > "$NOTES"
          gh release edit "$TAG" --notes-file "$NOTES"
