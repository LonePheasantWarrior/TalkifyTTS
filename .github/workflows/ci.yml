name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# N16：显式只读最小权限；Action 按 commit SHA 固定（与 release.yml 同源）
permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain --no-daemon

      # R8 冒烟：proguard keep 规则（sherpa JNI/DashScope Gson/JLayer/腾讯云）的回归
      # 若只在打 tag 的 release.yml 才暴露，成本过高——CI 每次构建 release 包验证
      # （未注入签名密钥时产物不签名，仅验证编译与混淆链路）
      - name: Release smoke build (R8)
        run: ./gradlew assembleRelease --console=plain --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/
          if-no-files-found: ignore
