name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# N16：显式只读最小权限；Action 按 commit SHA 固定（与 release.yml 同源）
permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Android lint
        run: ./gradlew :app:lintDebug --console=plain --no-daemon

      # R8 冒烟：proguard keep 规则（sherpa JNI/DashScope Gson/JLayer/腾讯云）的回归
      # 若只在打 tag 的 release.yml 才暴露，成本过高——CI 每次构建 release 包验证
      # （未注入签名密钥时产物不签名，仅验证编译与混淆链路）
      - name: Release smoke build (R8)
        run: ./gradlew assembleRelease --console=plain --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/
          if-no-files-found: ignore
